<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="fg-title fg-desc">
  <title id="fg-title">Fructigen</title>
  <desc id="fg-desc">A seed head arranged on the golden angle inside an egg-shaped contour. One line leaves it as a shared trunk and divides into four lanes; a pulse travels the first lane before the other three.</desc>
  <defs>
    <linearGradient id="fg-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1015"/>
      <stop offset="1" stop-color="#0e161c"/>
    </linearGradient>
    <radialGradient id="fg-glow" cx="232" cy="180" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c27a" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#5ed6c8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#5ed6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg-strand" x1="338" y1="0" x2="1216" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c27a" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#5ed6c8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5ed6c8" stop-opacity=".28"/>
    </linearGradient>
    <clipPath id="fg-card"><rect width="1280" height="360" rx="22"/></clipPath>
  </defs>
  <style>
    .fg-seed { transform-origin: 232px 180px; animation: fg-turn 240s linear infinite; }
    .fg-a { animation: fg-breathe 9s ease-in-out -1s infinite; }
    .fg-b { animation: fg-breathe 9s ease-in-out -4s infinite; }
    .fg-c { animation: fg-breathe 9s ease-in-out -7s infinite; }
    .fg-pulse { fill: none; stroke: #bff3ec; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 300; stroke-dashoffset: 8; animation: fg-run 8s linear infinite; }
    .fg-follow { animation-delay: 1.5s; }
    .fg-node { animation: fg-arrive 8s linear infinite; }
    .fg-node.fg-follow { animation-delay: 1.5s; }
    @keyframes fg-turn { to { transform: rotate(360deg); } }
    @keyframes fg-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }
    @keyframes fg-run { 0% { stroke-dashoffset: 8; opacity: 0; } 4% { opacity: .9; } 40% { opacity: .9; } 46% { stroke-dashoffset: -100; opacity: 0; } 100% { stroke-dashoffset: -100; opacity: 0; } }
    @keyframes fg-arrive { 0%, 42% { opacity: .45; } 47% { opacity: 1; } 70%, 100% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .fg-seed, .fg-a, .fg-b, .fg-c, .fg-pulse, .fg-node { animation: none; } .fg-pulse { opacity: 0; } }
  </style>
