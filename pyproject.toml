[project]
name = "vril-fructigen"
version = "0.1.0a0"
description = "Prefix-plan compiler for subagent fan-out: decide the shared-context layout before dispatch, verify it after"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Standard library only. Nothing here may import the benchmark or the framework: they consume this.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.17", "mypy>=2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fructigen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# The numbers and rule sets below are the mechanism for CONSTRAINTS.md, which is the canonical
# statement of the bar and gives the reason for each. Change that file first, in its own commit.

[tool.ruff]
line-length = 108  # the longest line in the modules as moved from vril-bench; no reflow was needed
src = ["src", "tests"]
extend-exclude = ["versions"]  # a verbatim backup, not maintained code

[tool.ruff.lint]
# E/F/W pycodestyle and pyflakes, B bugbear, I import order, S the flake8-bandit security rules.
select = ["E", "F", "W", "B", "I", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest tests assert by design, and seed `random` for reproducible fixtures, never for secrets.
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src"]
exclude = ["^versions/"]  # a verbatim backup, not maintained code; ruff excludes it too

[tool.coverage.run]
branch = true
source = ["fructigen"]

[tool.coverage.report]
precision = 2
fail_under = 97.75  # measured 98.25 on 2026-11-12, less the 0.5 ratchet tolerance; must not fall
